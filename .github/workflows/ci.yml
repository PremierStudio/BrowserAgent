name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Knip (dead code / unused deps)
        run: npm run knip

      - name: Unit tests
        run: npm test

      - name: Coverage (100% gate)
        run: npm run coverage

      - name: Mutation (100% gate + survivor registry)
        run: npm run ci:survivors

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            coverage/
          retention-days: 14
