<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="BrowserEngine: turn one agent walkthrough into a CI test that runs with no AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f1b3d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- browser window motif (top-left) -->
  <g transform="translate(70, 48)">
    <rect x="0" y="0" width="170" height="120" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="170" height="28" rx="12" fill="#1e293b"/>
    <circle cx="17" cy="14" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="14" r="4.5" fill="#f59e0b"/>
    <circle cx="51" cy="14" r="4.5" fill="#22c55e"/>
    <rect x="66" y="7" width="90" height="14" rx="7" fill="#334155"/>
    <rect x="18" y="46" width="134" height="9" rx="4.5" fill="#334155"/>
    <rect x="18" y="66" width="108" height="9" rx="4.5" fill="#263449"/>
    <rect x="18" y="86" width="120" height="9" rx="4.5" fill="#263449"/>
  </g>

  <!-- wordmark: single run, no overlap -->
  <text x="280" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" fill="url(#word)" letter-spacing="-1">BrowserEngine</text>

  <!-- tagline -->
  <text x="284" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#94a3b8" font-weight="400">Walk once. Replay in CI with no AI.</text>

  <!-- accent underline -->
  <rect x="284" y="266" width="640" height="4" rx="2" fill="url(#accent)"/>
</svg>
