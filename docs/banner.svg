<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="BrowserAgent — unified, event-driven, visually-rich MCP browser-automation server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f1b3d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- browser window motif -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="150" height="110" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="26" rx="10" fill="#1e293b"/>
    <circle cx="16" cy="13" r="4" fill="#ef4444"/>
    <circle cx="32" cy="13" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="13" r="4" fill="#22c55e"/>
    <rect x="62" y="7" width="78" height="12" rx="6" fill="#334155"/>
    <rect x="16" y="42" width="118" height="8" rx="4" fill="#334155"/>
    <rect x="16" y="60" width="96" height="8" rx="4" fill="#263449"/>
    <rect x="16" y="78" width="106" height="8" rx="4" fill="#263449"/>
  </g>

  <!-- wordmark -->
  <text x="240" y="205" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#f8fafc" letter-spacing="-1">Browser</text>
  <text x="240" y="205" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="url(#accent)" letter-spacing="-1">Agent</text>

  <!-- tagline -->
  <text x="244" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#94a3b8" font-weight="400">Unified · Event-driven · Visually-rich MCP browser automation</text>

  <!-- accent underline -->
  <rect x="244" y="272" width="560" height="4" rx="2" fill="url(#accent)"/>
</svg>
